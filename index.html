<script>
  /* Instalar como app (só pela internet): manifesto + service worker.
     No duplo clique (file://) nada disso é carregado. */
  if (/^https?:$/.test(location.protocol)) {
    var linkManifesto = document.createElement('link');
    linkManifesto.rel = 'manifest';
    linkManifesto.href = 'manifest.webmanifest';
    document.head.appendChild(linkManifesto);
    if ('serviceWorker' in navigator && !/[?&](roteiro|demo)=/.test(location.search)) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  }
</script>
<script>
  /* registra erros de JavaScript (útil para diagnóstico e para os testes automáticos) */
  window.__errosGlobais = [];
  /* o roteiro automático de testes usa armazenamento separado */
  if (/[?&]roteiro=/.test(location.search)) window.__OUTS_PREFIXO = 'outs.roteiro.';
  /* os últimos erros também ficam salvos, para o diagnóstico em Configurações */
  function guardarErro(texto) {
    try {
      var k = (window.__OUTS_PREFIXO || 'outs.treino.') + 'diag.erros';
      var l = JSON.parse(localStorage.getItem(k) || '[]');
      l.unshift({ quando: Date.now(), texto: String(texto).slice(0, 300) });
      localStorage.setItem(k, JSON.stringify(l.slice(0, 8)));
    } catch (x) { /* armazenamento indisponível */ }
  }
  window.addEventListener('error', function (e) {
    window.__errosGlobais.push((e.message || 'erro') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
    document.documentElement.setAttribute('data-erros', String(window.__errosGlobais.length));
    document.documentElement.setAttribute('data-ultimo-erro', window.__errosGlobais[window.__errosGlobais.length - 1]);
    guardarErro(window.__errosGlobais[window.__errosGlobais.length - 1]);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var m = e.reason && (e.reason.stack || e.reason.message) || String(e.reason);
    window.__errosGlobais.push('Promise: ' + m);
    document.documentElement.setAttribute('data-erros', String(window.__errosGlobais.length));
    document.documentElement.setAttribute('data-ultimo-erro', String(m).slice(0, 300));
    guardarErro('Promise: ' + m);
  });
</script>
